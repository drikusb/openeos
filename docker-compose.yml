services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${DB_NAME:-eos_db}
      POSTGRES_USER: ${DB_USER:-eos_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eos_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    entrypoint: ["/app/entrypoint.sh"]
    # The container runs as uid 1000 (user "app"), so collectstatic and media
    # uploads write into this bind-mounted checkout as that uid. Docker Desktop
    # and Colima on macOS map it to your host user; on a Linux host the checkout
    # must be owned by uid 1000. If yours is owned by another uid, either chown
    # the checkout or add `user: "<uid>:<gid>"` to this service to match.
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-eos_db}
      DB_USER: ${DB_USER:-eos_user}
      DB_PASSWORD: ${DB_PASSWORD:-eos_password}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-please}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,192.168.1.251}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-adminpass}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
