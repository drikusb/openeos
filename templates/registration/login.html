<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — EOS App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-sm-10 col-md-7 col-lg-5 col-xl-4">
            <div class="text-center mb-4">
                <i class="bi bi-diagram-3-fill display-4 text-dark"></i>
                <h1 class="h3 mt-2 fw-bold">EOS App</h1>
                <p class="text-muted">Open-source EOS framework</p>
            </div>
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h2 class="h5 card-title mb-4">Sign in to your account</h2>

                    {% if form.errors %}
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-circle me-1"></i>
                        Invalid username or password. Please try again.
                    </div>
                    {% endif %}

                    <form method="post" action="{% url 'login' %}">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{{ next }}">

                        <div class="mb-3">
                            <label for="id_username" class="form-label">Username</label>
                            <input type="text" name="username" id="id_username"
                                   class="form-control" autocomplete="username"
                                   autofocus required>
                        </div>

                        <div class="mb-2">
                            <label for="id_password" class="form-label">Password</label>
                            <input type="password" name="password" id="id_password"
                                   class="form-control" autocomplete="current-password" required>
                        </div>
                        <div class="d-flex justify-content-end mb-4">
                            <a href="{% url 'password_reset' %}" class="small text-muted">Forgot password?</a>
                        </div>

                        <button type="submit" class="btn btn-dark w-100">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Sign in
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
