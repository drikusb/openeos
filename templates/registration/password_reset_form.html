{% extends "base.html" %}
{% block title %}Reset Password — EOS App{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <h2 class="h4 mb-4">Reset your password</h2>
        <p class="text-muted">Enter your email address and we'll send you a link to reset your password.</p>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_email" class="form-label">Email address</label>
                <input type="email" name="email" id="id_email" class="form-control" required autofocus>
            </div>
            <button type="submit" class="btn btn-dark w-100">Send reset link</button>
        </form>
        <p class="mt-3 text-center">
            <a href="{% url 'login' %}" class="text-muted small">Back to sign in</a>
        </p>
    </div>
</div>
{% endblock %}
